<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Gallery — Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0f0f0f;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", sans-serif;
        overflow: hidden;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(600px at 20% 20%, #1f1f1f 0%, transparent 60%),
          radial-gradient(500px at 80% 80%, #1a1a1a 0%, transparent 60%);
      }
      .card {
        position: relative;
        background: rgba(22, 22, 22, 0.9);
        backdrop-filter: blur(24px);
        padding: 42px 34px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        width: 360px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .dot {
        width: 40px;
        height: 40px;
        background: white;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        margin-bottom: 20px;
      }
      h2 {
        font-family: "Instrument Serif", serif;
        font-size: 30px;
        font-weight: 400;
        color: #f5f3ef;
        margin: 0 0 6px;
      }
      .sub {
        color: #7a7a7a;
        font-size: 12.5px;
        margin-bottom: 28px;
      }
      input {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: #1c1c1c;
        color: white;
        font-size: 14px;
        outline: none;
      }
      input:focus {
        border-color: rgba(255, 255, 255, 0.25);
        background: #222;
      }
      button {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        background: #f5f3ef;
        color: #0f0f0f;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
      }
      button:hover {
        background: white;
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      #msg {
        color: #ff7a7a;
        font-size: 12px;
        margin-top: 10px;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="card">
      <div class="dot">◐</div>
      <h2>My Gallery</h2>
      <div class="sub">Private • Silahkan Login Terlebih Dahulu</div>
      <input id="user" placeholder="Username" /><input
        id="pass"
        type="password"
        placeholder="Password"
      />
      <button id="btnLogin">Continue →</button>
      <div id="msg"></div>
    </div>
    <script>
      if (location.search.includes("logout")) localStorage.clear();
      async function doLogin() {
        const u = document.getElementById("user"),
          p = document.getElementById("pass"),
          msg = document.getElementById("msg");
        msg.textContent = "Loading...";
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u.value, password: p.value }),
        });
        const d = await r.json();
        if (d.success) {
          localStorage.setItem("isLoggedIn", "true");
          location.href = "index.html";
        } else {
          msg.textContent = "Username / Password salah — pakai aries / aries";
        }
      }
      document.getElementById("btnLogin").onclick = doLogin;
      // FITUR ENTER — BARU
      document.getElementById("user").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          doLogin();
        }
      });
      document.getElementById("pass").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          doLogin();
        }
      });
      if (
        localStorage.getItem("isLoggedIn") === "true" &&
        !location.search.includes("logout")
      )
        location.href = "index.html";
    </script>
  </body>
</html>
