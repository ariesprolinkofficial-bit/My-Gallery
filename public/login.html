<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Selamat Datang</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0d0d0d;
        color: #f5f3ef;
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #141414;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 28px;
        padding: 40px 28px 32px;
        text-align: center;
      }
      .title {
        font-family: "Instrument Serif", serif;
        font-size: 44px;
        letter-spacing: 0.04em;
        line-height: 1;
      }
      .sub {
        color: #777;
        font-size: 13.5px;
        margin-top: 14px;
        letter-spacing: 0.02em;
      }
      .inputs {
        margin-top: 36px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .inputs input {
        width: 100%;
        padding: 16px 20px;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #1e1e1e;
        color: #fff;
        outline: none;
        text-align: center;
        font-size: 14px;
        font-family: "Inter", sans-serif;
      }
      .inputs input::placeholder {
        color: #666;
      }
      .inputs input:focus {
        border-color: rgba(255, 255, 255, 0.22);
        background: #232323;
      }
      #loginBtn {
        margin-top: 10px;
        width: 100%;
        padding: 16px;
        border-radius: 100px;
        border: none;
        background: #f5f3ef;
        color: #0d0d0d;
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: 0.2s;
      }
      #loginBtn:hover {
        background: #fff;
        transform: translateY(-1px);
      }
      .foot {
        margin-top: 32px;
        color: #555;
        font-size: 12px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Selamat Datang</div>
      <div class="sub">Silahkan Login Terlebih Dahulu</div>

      <div class="inputs">
        <input id="user" placeholder="Username" />
        <input id="pass" type="password" placeholder="Password" />
        <button id="loginBtn">LOGIN</button>
      </div>

      <div class="foot">@ariesprolinkofficial</div>
    </div>

    <script>
      const u = document.getElementById("user"),
        p = document.getElementById("pass"),
        b = document.getElementById("loginBtn");
      b.onclick = () => {
        if (u.value.trim() === "admin" && p.value.trim() === "admin123") {
          localStorage.setItem("isLoggedIn", "true");
          location.href = "index.html";
        } else {
          alert("Username / Password salah!");
        }
      };
      p.addEventListener("keydown", (e) => {
        if (e.key === "Enter") b.click();
      });
    </script>
  </body>
</html>
