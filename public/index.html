<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Gallery</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(#0ea5e9, #e0f2fe);
        font-family: Arial;
        text-align: center;
        padding-top: 30px;
      }
      h1 {
        color: white;
      }
      #search {
        width: 300px;
        padding: 12px 20px;
        border-radius: 25px;
        border: none;
        text-align: center;
      }
      #btnTambah {
        margin-top: 15px;
        padding: 8px 18px;
        border-radius: 20px;
        border: none;
        background: white;
        color: #0ea5e9;
        font-weight: bold;
        cursor: pointer;
      }
      #folderList {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        margin-top: 30px;
        padding: 20px;
      }
      .folder {
        background: white;
        padding: 20px 30px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        font-weight: bold;
        min-width: 120px;
        position: relative;
      }
      .folder.selected {
        outline: 3px solid #0ea5e9;
      }
      .folder input {
        position: absolute;
        left: 8px;
        top: 8px;
      }
      #inside {
        display: none;
      }
      #back {
        margin: 10px;
        padding: 6px 15px;
        border-radius: 15px;
        border: none;
        background: white;
        cursor: pointer;
      }
      #photos {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
      }
      #photos img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 10px;
      }
      .topBtn {
        position: fixed;
        top: 15px;
        right: 15px;
        background: white;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: none;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        z-index: 100;
      }
      #menuBox {
        position: fixed;
        top: 60px;
        right: 15px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        display: none;
        flex-direction: column;
        z-index: 101;
        text-align: left;
        overflow: hidden;
      }
      #menuBox button {
        padding: 12px 18px;
        border: none;
        background: white;
        text-align: left;
        cursor: pointer;
        border-bottom: 1px solid #eee;
      }
      #menuBox button:hover {
        background: #f0f8ff;
      }
    </style>
  </head>
  <body>
    <!-- DI LUAR : TOMBOL LOGOUT -->
    <button id="logoutBtn" class="topBtn" title="Logout">⎋</button>
    <!-- DI DALAM : TITIK 3 -->
    <button id="menuBtn" class="topBtn" style="display: none">⋮</button>

    <div id="menuBox">
      <button id="mPilih">✓ Pilih</button>
      <button id="mPilihSemua">☑ Pilih Semua</button>
      <button id="mTambahFoto">🖼️ Tambahkan Foto</button>
      <button id="mTambahFolder">📁 Tambah Folder</button>
      <button id="mHapus">🗑️ Hapus Folder</button>
    </div>

    <div id="outside">
      <h1>📁 My Gallery</h1>
      <input id="search" placeholder="🔍 Cari folder" /><br />
      <button id="btnTambah">+ Tambah Folder</button>
      <div id="folderList"></div>
    </div>

    <div id="inside">
      <h1 id="folderName"></h1>
      <button id="back">← Kembali</button><br /><br />
      <input
        type="file"
        id="fileInput"
        accept="image/*"
        style="display: none"
        multiple
      />
      <div id="photos"></div>
    </div>

    <script>
      let folders = JSON.parse(localStorage.getItem("myFolders") || "[]");
      let activeId = null,
        selectMode = false;
      let selectedIds = new Set();

      const list = document.getElementById("folderList");
      const search = document.getElementById("search");
      const outside = document.getElementById("outside");
      const inside = document.getElementById("inside");
      const logoutBtn = document.getElementById("logoutBtn");
      const menuBtn = document.getElementById("menuBtn");
      const menuBox = document.getElementById("menuBox");

      function save() {
        localStorage.setItem("myFolders", JSON.stringify(folders));
      }

      function render() {
        list.innerHTML = "";
        const q = search.value.toLowerCase();
        folders
          .filter((f) => f.name.toLowerCase().includes(q))
          .forEach((f) => {
            const d = document.createElement("div");
            d.className = "folder";
            if (selectedIds.has(f.id)) d.classList.add("selected");
            d.textContent = "📁 " + f.name;
            d.onclick = () => openFolder(f.id);
            list.appendChild(d);
          });
      }
      function openFolder(id) {
        activeId = id;
        document.getElementById("folderName").textContent =
          "📁 " + folders.find((x) => x.id == id).name;
        outside.style.display = "none";
        inside.style.display = "block";
        logoutBtn.style.display = "none";
        menuBtn.style.display = "block";
        renderPhotos();
      }
      function renderPhotos() {
        const c = document.getElementById("photos");
        c.innerHTML = "";
        const photos = JSON.parse(
          localStorage.getItem("photos_" + activeId) || "[]",
        );
        photos.forEach((src, i) => {
          const div = document.createElement("div");
          div.style.position = "relative";
          const img = document.createElement("img");
          img.src = src;
          // kalau mode pilih foto
          if (selectMode) {
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.style.position = "absolute";
            cb.style.top = "5px";
            cb.style.left = "5px";
            cb.checked = selectedIds.has("p_" + i);
            cb.onchange = () => {
              if (cb.checked) selectedIds.add("p_" + i);
              else selectedIds.delete("p_" + i);
            };
            div.appendChild(cb);
          }
          div.appendChild(img);
          c.appendChild(div);
        });
      }

      // LOGOUT - DI LUAR FOLDER
      logoutBtn.onclick = () => {
        if (confirm("Mau logout?")) {
          localStorage.removeItem("isLogin");
          window.location.href = "login.html";
        }
      };

      // TITIK 3 - HANYA DI DALAM FOLDER
      menuBtn.onclick = () => {
        menuBox.style.display =
          menuBox.style.display == "flex" ? "none" : "flex";
      };
      window.onclick = (e) => {
        if (e.target != menuBtn && !menuBox.contains(e.target))
          menuBox.style.display = "none";
      };

      document.getElementById("mPilih").onclick = () => {
        selectMode = !selectMode;
        selectedIds.clear();
        menuBox.style.display = "none";
        renderPhotos();
      };
      document.getElementById("mPilihSemua").onclick = () => {
        selectMode = true;
        menuBox.style.display = "none";
        const photos = JSON.parse(
          localStorage.getItem("photos_" + activeId) || "[]",
        );
        photos.forEach((_, i) => selectedIds.add("p_" + i));
        renderPhotos();
      };
      document.getElementById("mTambahFoto").onclick = () => {
        menuBox.style.display = "none";
        document.getElementById("fileInput").click();
      };
      document.getElementById("mTambahFolder").onclick = () => {
        menuBox.style.display = "none";
        const name = prompt("Nama folder baru di dalam ini?");
        if (!name) return;
        // bikin sub folder? untuk sekarang balik ke luar dan bikin folder baru
        folders.push({ id: Date.now(), name: name.trim() });
        save();
        alert("Folder dibuat, kembali untuk lihat");
      };
      document.getElementById("mHapus").onclick = () => {
        menuBox.style.display = "none";
        if (selectedIds.size == 0) {
          if (
            confirm(
              "Hapus folder " +
                folders.find((x) => x.id == activeId).name +
                " ?",
            )
          ) {
            folders = folders.filter((f) => f.id != activeId);
            localStorage.removeItem("photos_" + activeId);
            save();
            inside.style.display = "none";
            outside.style.display = "block";
            logoutBtn.style.display = "block";
            menuBtn.style.display = "none";
            activeId = null;
            render();
          }
          return;
        }
        // hapus foto terpilih
        let photos = JSON.parse(
          localStorage.getItem("photos_" + activeId) || "[]",
        );
        photos = photos.filter((_, i) => !selectedIds.has("p_" + i));
        localStorage.setItem("photos_" + activeId, JSON.stringify(photos));
        selectedIds.clear();
        selectMode = false;
        renderPhotos();
      };

      document.getElementById("btnTambah").onclick = () => {
        const name = prompt("Nama folder baru:");
        if (!name) return;
        folders.push({ id: Date.now(), name: name.trim() });
        save();
        render();
      };
      search.oninput = render;
      document.getElementById("back").onclick = () => {
        inside.style.display = "none";
        outside.style.display = "block";
        logoutBtn.style.display = "block";
        menuBtn.style.display = "none";
        activeId = null;
        selectMode = false;
        selectedIds.clear();
        render();
      };
      document.getElementById("fileInput").onchange = (e) => {
        const files = [...e.target.files];
        if (!files.length) return;
        const key = "photos_" + activeId;
        let photos = JSON.parse(localStorage.getItem(key) || "[]");
        let loaded = 0;
        files.forEach((file) => {
          const r = new FileReader();
          r.onload = (ev) => {
            photos.push(ev.target.result);
            loaded++;
            if (loaded == files.length) {
              localStorage.setItem(key, JSON.stringify(photos));
              renderPhotos();
            }
          };
          r.readAsDataURL(file);
        });
      };
      render();
    </script>
  </body>
</html>
