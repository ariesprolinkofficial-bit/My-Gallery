<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f3ef;
        font-family: "Inter", sans-serif;
        color: #1a1a1a;
      }
      .top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: rgba(246, 243, 239, 0.8);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        z-index: 50;
      }
      .logo {
        font-family: "Instrument Serif", serif;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      .topBtn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: white;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .topBtn:hover {
        background: #1a1a1a;
        color: white;
      }
      .wrap {
        padding: 100px 28px 40px;
        max-width: 1100px;
        margin: 0 auto;
      }
      #search {
        width: 320px;
        max-width: 100%;
        padding: 12px 18px;
        border-radius: 100px;
        border: 1px solid #e8e3dd;
        background: white;
        font-size: 13.5px;
        outline: none;
      }
      #search:focus {
        border-color: #1a1a1a;
      }
      .h {
        font-family: "Instrument Serif", serif;
        font-size: 38px;
        font-weight: 400;
        margin: 24px 0 8px;
        letter-spacing: -0.03em;
      }
      .sub {
        color: #9a9a9a;
        font-size: 13px;
        margin-bottom: 28px;
      }
      #btnTambah {
        padding: 10px 18px;
        border-radius: 100px;
        border: 1px solid #1a1a1a;
        background: #1a1a1a;
        color: white;
        font-size: 13px;
        cursor: pointer;
      }
      #folderList {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 32px;
      }
      .folder {
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.06);
        padding: 22px;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.25s;
        text-align: left;
      }
      .folder:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      }
      .folder b {
        font-weight: 500;
        font-size: 14px;
        display: block;
        margin-top: 10px;
      }
      .folder span {
        font-size: 11px;
        color: #9a9a9a;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      #inside {
        display: none;
      }
      .back {
        padding: 8px 14px;
        border-radius: 100px;
        border: 1px solid #e8e3dd;
        background: white;
        cursor: pointer;
        font-size: 13px;
        margin-bottom: 20px;
      }
      #photos {
        columns: 3 180px;
        column-gap: 14px;
      }
      #photos img {
        width: 100%;
        margin-bottom: 14px;
        border-radius: 16px;
        display: block;
        break-inside: avoid;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      }
      #menuBox {
        position: fixed;
        top: 74px;
        right: 28px;
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        display: none;
        flex-direction: column;
        z-index: 100;
        min-width: 200px;
        overflow: hidden;
      }
      #menuBox button {
        padding: 12px 16px;
        border: none;
        background: white;
        text-align: left;
        cursor: pointer;
        font-size: 13.5px;
        border-bottom: 1px solid #f3f0eb;
      }
      #menuBox button:hover {
        background: #f6f3ef;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="logo">My Gallery</div>
      <div style="display: flex; gap: 8px">
        <button id="logoutBtn" class="topBtn" title="Logout">⎋</button
        ><button id="menuBtn" class="topBtn" style="display: none">⋮</button>
      </div>
    </div>
    <div id="menuBox">
      <button id="mPilih">✓ Pilih</button
      ><button id="mPilihSemua">☑ Pilih Semua</button
      ><button id="mTambahFoto">＋ Tambahkan Foto</button
      ><button id="mTambahFolder">＋ Tambah Folder</button
      ><button id="mHapus" style="color: #c25a5a">— Hapus Folder</button>
    </div>

    <div class="wrap">
      <div id="outside">
        <input id="search" placeholder="Search folder" />
        <div class="h">Your folders</div>
        <div class="sub"><span id="count">0</span> collections • private</div>
        <button id="btnTambah">＋ New folder</button>
        <div id="folderList"></div>
      </div>
      <div id="inside">
        <button id="back" class="back">← Back</button>
        <div class="h" id="folderName"></div>
        <div class="sub">Drag & drop or use menu to add</div>
        <input
          type="file"
          id="fileInput"
          accept="image/*"
          style="display: none"
          multiple
        />
        <div id="photos"></div>
      </div>
    </div>

    <script>
      if (localStorage.getItem("isLoggedIn") !== "true")
        location.href = "login.html";
      let folders = JSON.parse(localStorage.getItem("myFolders") || "[]");
      let activeId = null;
      const list = document.getElementById("folderList"),
        search = document.getElementById("search"),
        outside = document.getElementById("outside"),
        inside = document.getElementById("inside"),
        logoutBtn = document.getElementById("logoutBtn"),
        menuBtn = document.getElementById("menuBtn"),
        menuBox = document.getElementById("menuBox");
      function save() {
        localStorage.setItem("myFolders", JSON.stringify(folders));
        document.getElementById("count").textContent = folders.length;
      }
      function render() {
        list.innerHTML = "";
        const q = search.value.toLowerCase();
        folders
          .filter((f) => f.name.toLowerCase().includes(q))
          .forEach((f) => {
            const photos = JSON.parse(
              localStorage.getItem("photos_" + f.id) || "[]",
            );
            const d = document.createElement("div");
            d.className = "folder";
            d.innerHTML = `<span>Folder • ${photos.length} photos</span><b>${f.name}</b>`;
            d.onclick = () => openFolder(f.id);
            list.appendChild(d);
          });
        save();
      }
      function openFolder(id) {
        activeId = id;
        document.getElementById("folderName").textContent = folders.find(
          (x) => x.id == id,
        ).name;
        outside.style.display = "none";
        inside.style.display = "block";
        logoutBtn.style.display = "none";
        menuBtn.style.display = "flex";
        renderPhotos();
      }
      function renderPhotos() {
        const c = document.getElementById("photos");
        c.innerHTML = "";
        const photos = JSON.parse(
          localStorage.getItem("photos_" + activeId) || "[]",
        );
        if (!photos.length) {
          c.innerHTML =
            "<p style='color:#9a9a9a;font-size:13px'>No photos yet. Click ⋮ to add.</p>";
          return;
        }
        photos.forEach((s) => {
          const img = document.createElement("img");
          img.src = s;
          c.appendChild(img);
        });
      }
      logoutBtn.onclick = () => {
        localStorage.removeItem("isLoggedIn");
        location.href = "login.html?logout=1";
      };
      menuBtn.onclick = () =>
        (menuBox.style.display =
          menuBox.style.display === "flex" ? "none" : "flex");
      window.addEventListener("click", (e) => {
        if (e.target !== menuBtn && !menuBox.contains(e.target))
          menuBox.style.display = "none";
      });
      mTambahFoto.onclick = () => {
        menuBox.style.display = "none";
        fileInput.click();
      };
      mTambahFolder.onclick = () => {
        menuBox.style.display = "none";
        const n = prompt("Nama folder baru:");
        if (!n) return;
        folders.push({ id: Date.now(), name: n.trim() });
        save();
      };
      mHapus.onclick = () => {
        menuBox.style.display = "none";
        if (!confirm("Hapus folder ini?")) return;
        folders = folders.filter((f) => f.id != activeId);
        localStorage.removeItem("photos_" + activeId);
        save();
        inside.style.display = "none";
        outside.style.display = "block";
        logoutBtn.style.display = "flex";
        menuBtn.style.display = "none";
        activeId = null;
        render();
      };
      mPilih.onclick = () => {
        menuBox.style.display = "none";
        alert("Mode pilih aktif");
      };
      mPilihSemua.onclick = () => {
        menuBox.style.display = "none";
      };
      btnTambah.onclick = () => {
        const n = prompt("Nama folder baru:");
        if (!n) return;
        folders.push({ id: Date.now(), name: n.trim() });
        save();
        render();
      };
      search.oninput = render;
      back.onclick = () => {
        inside.style.display = "none";
        outside.style.display = "block";
        logoutBtn.style.display = "flex";
        menuBtn.style.display = "none";
        activeId = null;
        render();
      };
      fileInput.onchange = (e) => {
        const files = [...e.target.files];
        if (!files.length) return;
        const key = "photos_" + activeId;
        let photos = JSON.parse(localStorage.getItem(key) || "[]");
        let l = 0;
        files.forEach((f) => {
          const r = new FileReader();
          r.onload = (ev) => {
            photos.push(ev.target.result);
            l++;
            if (l === files.length) {
              localStorage.setItem(key, JSON.stringify(photos));
              renderPhotos();
              render();
            }
          };
          r.readAsDataURL(f);
        });
      };
      render();
    </script>
  </body>
</html>
