<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0d0d0d;
        color: #f5f3ef;
        font-family: "Inter", sans-serif;
        min-height: 100vh;
      }
      .top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 68px;
        background: #0d0d0d;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        z-index: 100;
      }
      .logo {
        font-family: "Instrument Serif", serif;
        font-size: 26px;
      }
      .wrap {
        padding: 92px 18px 40px;
        max-width: 1100px;
        margin: 0 auto;
      }
      .centerHead {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      #search {
        width: 100%;
        max-width: 340px;
        padding: 13px 20px;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #1a1a1a;
        color: #fff;
        text-align: center;
        outline: none;
      }
      #btnTambah {
        margin-top: 16px;
        padding: 11px 26px;
        border-radius: 100px;
        border: none;
        background: #f5f3ef;
        color: #0d0d0d;
        font-weight: 500;
        cursor: pointer;
      }
      .sub {
        color: #666;
        font-size: 12px;
        margin-top: 12px;
      }
      .sub b {
        color: #aaa;
      }
      #folderList {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
        margin-top: 32px;
      }
      .folder {
        background: #181818;
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 20px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="logo">My Gallery</div>

      <!-- INI VERSI 3 GLASS PILL - PAKAI INLINE STYLE BIAR PASTI JADI -->
      <button
        id="logoutBtn"
        style="
          all: unset;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 9px 22px;
          border-radius: 100px;
          border: 1px solid rgba(255, 255, 255, 0.18);
          background: rgba(255, 255, 255, 0.06);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          font-family: &quot;Inter&quot;, sans-serif;
          font-size: 13.5px;
          color: #f5f3ef;
          cursor: pointer;
          box-shadow:
            0 2px 12px rgba(0, 0, 0, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        "
      >
        Logout
      </button>
    </div>

    <div class="wrap">
      <div id="outside">
        <div class="centerHead">
          <input id="search" placeholder="Search folder" />
          <button id="btnTambah">＋ New folder</button>
          <div class="sub">
            <b id="folderCount">1</b> Folder <b id="photoCount">0</b> Foto
          </div>
        </div>
        <div id="folderList">
          <div class="folder">
            <b>aries</b><br /><span style="font-size: 10px; color: #777"
              >0 FOTO</span
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      document.getElementById("logoutBtn").onclick = () => {
        localStorage.removeItem("isLoggedIn");
        location.href = "login.html";
      };
      document.getElementById("btnTambah").onclick = () => {
        let n = prompt("Nama folder:");
        if (n) {
          let f = JSON.parse(localStorage.getItem("myFolders") || "[]");
          f.push({ id: Date.now(), name: n });
          localStorage.setItem("myFolders", JSON.stringify(f));
          location.reload();
        }
      };
      let folders = JSON.parse(localStorage.getItem("myFolders") || "[]");
      document.getElementById("folderCount").textContent = folders.length || 1;
    </script>
  </body>
</html>
