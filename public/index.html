<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0f0f0f;
        color: #f5f3ef;
        font-family: "Inter", sans-serif;
      }
      .top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: rgba(15, 15, 15, 0.92);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        z-index: 50;
      }
      .logo {
        font-family: "Instrument Serif", serif;
        font-size: 24px;
        letter-spacing: 0.01em;
      }
      #logoutBtn {
        all: unset !important;
        font-family: "Instrument Serif", serif !important;
        font-size: 22px !important;
        color: #f5f3ef !important;
        opacity: 0.88;
        cursor: pointer;
        letter-spacing: 0.01em;
        transition: 0.2s;
      }
      #logoutBtn:hover {
        opacity: 1;
      }
      .wrap {
        padding: 90px 28px 40px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .centerHead {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        text-align: center;
      }
      #search {
        width: 100%;
        max-width: 380px;
        padding: 13px 20px;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #1c1c1c;
        color: white;
        font-size: 13.5px;
        outline: none;
        text-align: center;
      }
      #btnTambah {
        margin-top: 18px;
        padding: 11px 24px;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: white;
        color: black;
        font-size: 13.5px;
        font-weight: 500;
        cursor: pointer;
      }
      .sub {
        color: #7a7a7a;
        font-size: 13px;
        margin-top: 12px;
      }
      .sub b {
        color: #a8a8a8;
        font-weight: 500;
      }
      #folderList {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 32px;
      }
      .folder {
        background: #1c1c1c;
        border: 1px solid rgba(255, 255, 255, 0.07);
        padding: 20px;
        border-radius: 22px;
        cursor: pointer;
      }
      .folder b {
        font-size: 18px;
        display: block;
        margin-bottom: 6px;
      }
      .folder span {
        font-size: 11px;
        color: #777;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #inside {
        display: none;
      }
      .back {
        padding: 8px 16px;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #1c1c1c;
        color: white;
        cursor: pointer;
        font-size: 13px;
      }
      #photos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
        margin-top: 24px;
      }
      .photoWrap {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        background: #1c1c1c;
        aspect-ratio: 1/1;
        cursor: pointer;
      }
      .photoWrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
      }
      #lightbox.show {
        display: flex;
      }
      #lightbox img {
        max-width: 92vw;
        max-height: 88vh;
        border-radius: 18px;
      }
      #menuBox {
        position: fixed;
        top: 72px;
        right: 28px;
        background: #1e1e1e;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        display: none;
        flex-direction: column;
        z-index: 100;
        min-width: 210px;
        overflow: hidden;
      }
      #menuBox button {
        padding: 12px 16px;
        border: none;
        background: #1e1e1e;
        color: #ddd;
        text-align: left;
        cursor: pointer;
        font-size: 13.5px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      #barSelect {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(28, 28, 28, 0.92);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #f5f3ef;
        padding: 8px 10px 8px 20px;
        border-radius: 100px;
        display: none;
        gap: 14px;
        align-items: center;
        z-index: 90;
      }
      #barSelect button {
        padding: 8px 18px;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.08);
        color: #ddd;
        font-size: 13px;
        cursor: pointer;
      }
      .h {
        font-family: "Instrument Serif", serif;
        font-size: 36px;
        margin: 0 0 6px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="logo">My Gallery</div>
      <div style="display: flex; gap: 10px; align-items: center">
        <button id="logoutBtn">Logout</button
        ><button
          id="menuBtn"
          style="
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #1c1c1c;
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
          "
        >
          ⋮
        </button>
      </div>
    </div>
    <div id="menuBox">
      <button id="mPilih">✓ Pilih</button
      ><button id="mPilihSemua">☑ Pilih Semua</button
      ><button id="mTambahFoto">＋ Tambahkan Foto</button
      ><button id="mTambahFolder">＋ Tambah Folder</button
      ><button id="mRename">✎ Ganti Nama Folder</button
      ><button id="mHapus" style="color: #ff8a8a">— Hapus</button>
    </div>
    <div id="barSelect">
      <span id="selCount">0 dipilih</span>
      <div style="display: flex; gap: 8px">
        <button id="btnCancel">Batal</button
        ><button id="btnDeleteSel">Hapus</button>
      </div>
    </div>
    <div id="lightbox">
      <button
        id="closeLight"
        style="
          position: fixed;
          top: 20px;
          right: 20px;
          width: 40px;
          height: 40px;
          border-radius: 50%;
          border: 1px solid rgba(255, 255, 255, 0.2);
          background: rgba(255, 255, 255, 0.1);
          color: white;
          font-size: 20px;
          cursor: pointer;
        "
      >
        ✕</button
      ><img id="lightImg" />
    </div>
    <div class="wrap">
      <div id="outside">
        <div class="centerHead">
          <input id="search" placeholder="Search folder" /><button
            id="btnTambah"
          >
            ＋ New folder
          </button>
          <div class="sub">
            <b id="folderCount">0</b> Folder <b id="photoCount">0</b> Foto
          </div>
        </div>
        <div id="folderList"></div>
      </div>
      <div id="inside">
        <button id="back" class="back">← Back</button>
        <div class="h" id="folderName"></div>
        <div class="sub" id="insideSub"></div>
        <input
          type="file"
          id="fileInput"
          accept="image/*"
          style="display: none"
          multiple
        />
        <div id="photos"></div>
      </div>
    </div>
    <script>
      if (localStorage.getItem("isLoggedIn") !== "true")
        location.href = "login.html";
      let folders = JSON.parse(localStorage.getItem("myFolders") || "[]");
      let activeId = null,
        selectMode = false,
        selected = new Set();
      const list = document.getElementById("folderList"),
        search = document.getElementById("search"),
        outside = document.getElementById("outside"),
        inside = document.getElementById("inside"),
        logoutBtn = document.getElementById("logoutBtn"),
        menuBtn = document.getElementById("menuBtn"),
        menuBox = document.getElementById("menuBox"),
        photosDiv = document.getElementById("photos"),
        bar = document.getElementById("barSelect"),
        lightbox = document.getElementById("lightbox"),
        lightImg = document.getElementById("lightImg");
      function save() {
        localStorage.setItem("myFolders", JSON.stringify(folders));
        const total = folders.reduce((s, f) => {
          try {
            return (
              s +
              JSON.parse(localStorage.getItem("photos_" + f.id) || "[]").length
            );
          } catch {
            return s;
          }
        }, 0);
        document.getElementById("folderCount").textContent = folders.length;
        document.getElementById("photoCount").textContent = total;
      }
      function render() {
        list.innerHTML = "";
        const q = search.value.toLowerCase();
        folders
          .filter((f) => f.name.toLowerCase().includes(q))
          .forEach((f) => {
            const ph = JSON.parse(
              localStorage.getItem("photos_" + f.id) || "[]",
            );
            const d = document.createElement("div");
            d.className = "folder";
            d.innerHTML = `<b>${f.name}</b><span>${ph.length} FOTO</span>`;
            d.onclick = () => openFolder(f.id);
            list.appendChild(d);
          });
        save();
      }
      function openFolder(id) {
        activeId = id;
        selectMode = false;
        selected.clear();
        updateBar();
        document.getElementById("folderName").textContent = folders.find(
          (x) => x.id == id,
        ).name;
        outside.style.display = "none";
        inside.style.display = "block";
        logoutBtn.style.display = "none";
        menuBtn.style.display = "flex";
        menuBox.style.display = "none";
        renderPhotos();
      }
      function renderPhotos() {
        photosDiv.innerHTML = "";
        const photos = JSON.parse(
          localStorage.getItem("photos_" + activeId) || "[]",
        );
        document.getElementById("insideSub").textContent =
          photos.length + " Foto • double klik untuk perbesar";
        if (!photos.length) {
          photosDiv.innerHTML =
            "<p style='color:#777;font-size:13px'>Belum ada Foto.</p>";
          return;
        }
        photos.forEach((src, i) => {
          const w = document.createElement("div");
          w.className = "photoWrap";
          const img = document.createElement("img");
          img.src = src;
          w.appendChild(img);
          w.ondblclick = () => {
            lightImg.src = src;
            lightbox.classList.add("show");
          };
          photosDiv.appendChild(w);
        });
        updateBar();
      }
      function updateBar() {
        bar.style.display = "none";
      }
      logoutBtn.onclick = () => {
        localStorage.removeItem("isLoggedIn");
        location.href = "login.html";
      };
      menuBtn.onclick = () =>
        (menuBox.style.display =
          menuBox.style.display === "flex" ? "none" : "flex");
      lightbox.onclick = (e) => {
        if (e.target === lightbox || e.target === lightImg)
          lightbox.classList.remove("show");
      };
      document.getElementById("closeLight").onclick = () =>
        lightbox.classList.remove("show");
      document.getElementById("btnTambah").onclick = () => {
        const n = prompt("Nama folder baru:");
        if (!n) return;
        folders.push({ id: Date.now(), name: n.trim() });
        save();
        render();
      };
      search.oninput = render;
      document.getElementById("back").onclick = () => {
        inside.style.display = "none";
        outside.style.display = "block";
        logoutBtn.style.display = "block";
        menuBtn.style.display = "none";
        activeId = null;
        render();
      };
      render();
    </script>
  </body>
</html>
