<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0f0f0f;
        color: #f5f3ef;
        font-family: "Inter", sans-serif;
      }
      .top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: rgba(15, 15, 15, 0.85);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        z-index: 50;
      }
      .logo {
        font-family: "Instrument Serif", serif;
        font-size: 22px;
      }
      .topBtn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #1c1c1c;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .topBtn:hover {
        background: white;
        color: black;
      }
      .wrap {
        padding: 90px 28px 40px;
        max-width: 1200px;
        margin: 0 auto;
      }
      #search {
        width: 320px;
        padding: 11px 18px;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #1c1c1c;
        color: white;
        font-size: 13px;
        outline: none;
      }
      .h {
        font-family: "Instrument Serif", serif;
        font-size: 40px;
        margin: 26px 0 6px;
      }
      .sub {
        color: #7a7a7a;
        font-size: 13px;
        margin-bottom: 24px;
      }
      #btnTambah {
        padding: 10px 18px;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: white;
        color: black;
        font-size: 13px;
        cursor: pointer;
      }
      #folderList {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 30px;
      }
      .folder {
        background: #1c1c1c;
        border: 1px solid rgba(255, 255, 255, 0.07);
        padding: 20px;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.25s;
        text-align: left;
      }
      .folder:hover {
        transform: translateY(-3px);
        background: #222;
      }
      .folder b {
        font-weight: 500;
        font-size: 18px;
        display: block;
        color: #f0ede8;
        margin-bottom: 6px;
      }
      .folder span {
        font-size: 11px;
        color: #777;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #inside {
        display: none;
      }
      .back {
        padding: 8px 16px;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #1c1c1c;
        color: white;
        cursor: pointer;
        font-size: 13px;
      }
      #photos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
        margin-top: 24px;
      }
      .photoWrap {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        background: #1c1c1c;
        aspect-ratio: 1/1;
        cursor: pointer;
      }
      .photoWrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: 0.2s;
      }
      .photoWrap:hover img {
        transform: scale(1.03);
      }
      .photoWrap.selected {
        outline: 2px solid white;
      }
      .check {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1.5px solid white;
        background: rgba(0, 0, 0, 0.4);
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: white;
      }
      .photoWrap.selectMode .check {
        display: flex;
      }
      .photoWrap.selected .check {
        background: white;
        color: black;
      }
      #lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        backdrop-filter: blur(10px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 20px;
      }
      #lightbox.show {
        display: flex;
      }
      #lightbox img {
        max-width: 92vw;
        max-height: 88vh;
        border-radius: 18px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
      }
      #closeLight {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 20px;
        cursor: pointer;
      }
      #menuBox {
        position: fixed;
        top: 72px;
        right: 28px;
        background: #1e1e1e;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        display: none;
        flex-direction: column;
        z-index: 100;
        min-width: 210px;
        overflow: hidden;
      }
      #menuBox button {
        padding: 12px 16px;
        border: none;
        background: #1e1e1e;
        color: #ddd;
        text-align: left;
        cursor: pointer;
        font-size: 13.5px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      #menuBox button:hover {
        background: #262626;
        color: white;
      }
      #barSelect {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        color: black;
        padding: 10px 20px;
        border-radius: 100px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        display: none;
        gap: 12px;
        align-items: center;
        z-index: 90;
        font-size: 13px;
      }
      #barSelect button {
        padding: 6px 14px;
        border-radius: 100px;
        border: none;
        background: black;
        color: white;
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="logo">My Gallery</div>
      <div style="display: flex; gap: 8px">
        <button id="logoutBtn" class="topBtn">⎋</button
        ><button id="menuBtn" class="topBtn" style="display: none">⋮</button>
      </div>
    </div>
    <div id="menuBox">
      <button id="mPilih">✓ Pilih</button
      ><button id="mPilihSemua">☑ Pilih Semua</button
      ><button id="mTambahFoto">＋ Tambahkan Foto</button
      ><button id="mTambahFolder">＋ Tambah Folder</button
      ><button id="mRename">✎ Ganti Nama Folder</button
      ><button id="mHapus" style="color: #ff8a8a">— Hapus</button>
    </div>
    <div id="barSelect">
      <span id="selCount">0 dipilih</span><button id="btnCancel">Batal</button
      ><button id="btnDeleteSel" style="background: #ff4d4d">Hapus</button>
    </div>
    <div id="lightbox">
      <button id="closeLight">✕</button><img id="lightImg" src="" />
    </div>

    <div class="wrap">
      <div id="outside">
        <input id="search" placeholder="Search folder" />
        <div class="h">Your folders</div>
        <div class="sub"><span id="count">0</span> collections</div>
        <button id="btnTambah">＋ New folder</button>
        <div id="folderList"></div>
      </div>
      <div id="inside">
        <button id="back" class="back">← Back</button>
        <div class="h" id="folderName"></div>
        <div class="sub" id="insideSub"></div>
        <input
          type="file"
          id="fileInput"
          accept="image/*"
          style="display: none"
          multiple
        />
        <div id="photos"></div>
      </div>
    </div>

    <script>
      if (localStorage.getItem("isLoggedIn") !== "true")
        location.href = "login.html";
      let folders = JSON.parse(localStorage.getItem("myFolders") || "[]");
      let activeId = null,
        selectMode = false,
        selected = new Set();
      const list = document.getElementById("folderList"),
        search = document.getElementById("search"),
        outside = document.getElementById("outside"),
        inside = document.getElementById("inside"),
        logoutBtn = document.getElementById("logoutBtn"),
        menuBtn = document.getElementById("menuBtn"),
        menuBox = document.getElementById("menuBox"),
        photosDiv = document.getElementById("photos"),
        bar = document.getElementById("barSelect"),
        lightbox = document.getElementById("lightbox"),
        lightImg = document.getElementById("lightImg");
      function save() {
        localStorage.setItem("myFolders", JSON.stringify(folders));
        count.textContent = folders.length;
      }
      function render() {
        list.innerHTML = "";
        const q = search.value.toLowerCase();
        folders
          .filter((f) => f.name.toLowerCase().includes(q))
          .forEach((f) => {
            const ph = JSON.parse(
              localStorage.getItem("photos_" + f.id) || "[]",
            );
            const d = document.createElement("div");
            d.className = "folder";
            d.innerHTML = `<b>${f.name}</b><span>${ph.length} Foto</span>`;
            d.onclick = () => openFolder(f.id);
            list.appendChild(d);
          });
        save();
      }
      function renameFolder(id) {
        const f = folders.find((x) => x.id == id);
        const n = prompt("Ganti nama folder:", f.name);
        if (!n || !n.trim()) return;
        f.name = n.trim();
        save();
        render();
        if (activeId == id)
          document.getElementById("folderName").textContent = f.name;
      }
      function openFolder(id) {
        activeId = id;
        selectMode = false;
        selected.clear();
        updateBar();
        document.getElementById("folderName").textContent = folders.find(
          (x) => x.id == id,
        ).name;
        outside.style.display = "none";
        inside.style.display = "block";
        logoutBtn.style.display = "none";
        menuBtn.style.display = "flex";
        menuBox.style.display = "none";
        renderPhotos();
      }
      function renderPhotos() {
        photosDiv.innerHTML = "";
        const photos = JSON.parse(
          localStorage.getItem("photos_" + activeId) || "[]",
        );
        insideSub.textContent =
          photos.length + " Foto • double klik untuk perbesar";
        if (!photos.length) {
          photosDiv.innerHTML =
            "<p style='color:#777;font-size:13px'>Belum ada Foto. Klik ⋮ → Tambahkan Foto</p>";
          return;
        }
        photos.forEach((src, i) => {
          const w = document.createElement("div");
          w.className =
            "photoWrap" +
            (selectMode ? " selectMode" : "") +
            (selected.has(i) ? " selected" : "");
          const img = document.createElement("img");
          img.src = src;
          const chk = document.createElement("div");
          chk.className = "check";
          chk.textContent = selected.has(i) ? "✓" : "";
          w.appendChild(img);
          w.appendChild(chk);
          w.onclick = () => {
            if (!selectMode) return;
            if (selected.has(i)) selected.delete(i);
            else selected.add(i);
            renderPhotos();
          };
          w.ondblclick = () => {
            if (selectMode) return;
            lightImg.src = src;
            lightbox.classList.add("show");
          };
          photosDiv.appendChild(w);
        });
        updateBar();
      }
      function updateBar() {
        if (!selectMode || selected.size === 0) {
          bar.style.display = "none";
          return;
        }
        bar.style.display = "flex";
        selCount.textContent = selected.size + " dipilih";
      }
      logoutBtn.onclick = () => {
        localStorage.removeItem("isLoggedIn");
        location.href = "login.html?logout=1";
      };
      menuBtn.onclick = () =>
        (menuBox.style.display =
          menuBox.style.display === "flex" ? "none" : "flex");
      window.addEventListener("click", (e) => {
        if (e.target !== menuBtn && !menuBox.contains(e.target))
          menuBox.style.display = "none";
      });
      lightbox.onclick = (e) => {
        if (e.target === lightbox || e.target === lightImg)
          lightbox.classList.remove("show");
      };
      closeLight.onclick = () => lightbox.classList.remove("show");
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") lightbox.classList.remove("show");
      });
      mPilih.onclick = () => {
        menuBox.style.display = "none";
        selectMode = !selectMode;
        selected.clear();
        mPilih.textContent = selectMode ? "✕ Batal Pilih" : "✓ Pilih";
        renderPhotos();
      };
      mPilihSemua.onclick = () => {
        menuBox.style.display = "none";
        const photos = JSON.parse(
          localStorage.getItem("photos_" + activeId) || "[]",
        );
        if (!selectMode) {
          selectMode = true;
          mPilih.textContent = "✕ Batal Pilih";
        }
        if (selected.size === photos.length) selected.clear();
        else photos.forEach((_, i) => selected.add(i));
        renderPhotos();
      };
      mTambahFoto.onclick = () => {
        menuBox.style.display = "none";
        fileInput.click();
      };
      mTambahFolder.onclick = () => {
        menuBox.style.display = "none";
        const n = prompt("Nama folder baru:");
        if (!n) return;
        folders.push({ id: Date.now(), name: n.trim() });
        save();
      };
      mRename.onclick = () => {
        menuBox.style.display = "none";
        renameFolder(activeId);
      };
      mHapus.onclick = () => {
        menuBox.style.display = "none";
        const photos = JSON.parse(
          localStorage.getItem("photos_" + activeId) || "[]",
        );
        if (selectMode && selected.size > 0) {
          if (!confirm("Hapus " + selected.size + " Foto?")) return;
          const newPhotos = photos.filter((_, i) => !selected.has(i));
          localStorage.setItem("photos_" + activeId, JSON.stringify(newPhotos));
          selected.clear();
          selectMode = false;
          mPilih.textContent = "✓ Pilih";
          renderPhotos();
          render();
        } else {
          if (
            !confirm(
              "Hapus folder '" +
                folders.find((x) => x.id == activeId).name +
                "' ?",
            )
          )
            return;
          folders = folders.filter((f) => f.id != activeId);
          localStorage.removeItem("photos_" + activeId);
          save();
          inside.style.display = "none";
          outside.style.display = "block";
          logoutBtn.style.display = "flex";
          menuBtn.style.display = "none";
          bar.style.display = "none";
          activeId = null;
          render();
        }
      };
      btnCancel.onclick = () => {
        selectMode = false;
        selected.clear();
        mPilih.textContent = "✓ Pilih";
        renderPhotos();
      };
      btnDeleteSel.onclick = () => mHapus.click();
      btnTambah.onclick = () => {
        const n = prompt("Nama folder baru:");
        if (!n) return;
        folders.push({ id: Date.now(), name: n.trim() });
        save();
        render();
      };
      search.oninput = render;
      back.onclick = () => {
        inside.style.display = "none";
        outside.style.display = "block";
        logoutBtn.style.display = "flex";
        menuBtn.style.display = "none";
        menuBox.style.display = "none";
        bar.style.display = "none";
        selectMode = false;
        selected.clear();
        mPilih.textContent = "✓ Pilih";
        activeId = null;
        render();
      };
      fileInput.onchange = (e) => {
        const files = [...e.target.files];
        if (!files.length) return;
        const key = "photos_" + activeId;
        let ph = JSON.parse(localStorage.getItem(key) || "[]");
        let l = 0;
        files.forEach((f) => {
          const r = new FileReader();
          r.onload = (ev) => {
            ph.push(ev.target.result);
            l++;
            if (l === files.length) {
              localStorage.setItem(key, JSON.stringify(ph));
              renderPhotos();
              render();
            }
          };
          r.readAsDataURL(f);
        });
      };
      render();
    </script>
  </body>
</html>
